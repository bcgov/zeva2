# Manually promotes a specific version to the Prod environment.
# It follows the same promotion pattern as Test:
# - tag images to the target namespace
# - create a deployment pull request in the CD repository

name: Release to Prod (Stable Release)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version to promote to Prod:"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  install-oc:
    uses: ./.github/workflows/install-oc-template.yaml

  deploy-prod:
    name: Deploy Zeva2 to Prod
    needs: install-oc
    uses: ./.github/workflows/deploy-template-by-pr.yaml
    with:
      git_ref: ${{ github.ref_name }}
      version: ${{ inputs.version }}
      tools_namespace: ${{ vars.OPENSHIFT_NAMESPACE_PLATE }}-tools
      values_file: values-prod.yaml
      target_namespace: ${{ vars.OPENSHIFT_NAMESPACE_PLATE }}-prod
      environment: prod
    secrets:
      manifest-repo-deploy-key: ${{ secrets.MANIFEST_REPO_DEPLOY_KEY }}
      manifest-repo-token: ${{ secrets.MANIFEST_REPO_TOKEN }}
      openshift-server: ${{ secrets.OPENSHIFT_SERVER }}
      openshift-token: ${{ secrets.OPENSHIFT_TOKEN }}
