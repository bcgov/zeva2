name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"
      - "!.github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-26.04
    steps:
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1

  deploys:
    name: TEST Deploys
    needs: [init]
    environment: test
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive Vault settings from OpenShift namespace
        id: vault_settings
        shell: bash
        env:
          OC_NAMESPACE: ${{ vars.OC_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ ! "$OC_NAMESPACE" =~ ^[a-z0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::OC_NAMESPACE must contain a lowercase namespace plate followed by a hyphen and environment."
            exit 1
          fi
          namespaceplate="${OC_NAMESPACE%%-*}"
          {
            echo "vault_secret_path=${namespaceplate}-nonprod/test"
            echo "vault_role=${namespaceplate}-nonprod"
            echo "vault_service_account=${namespaceplate}-vault"
          } >> "$GITHUB_OUTPUT"
      - uses: bcgov/actions-openshift/oc-runner@45d8c7f7d0d5e3b15786cb99a83f410e01547133 # v0.9.0
        env:
          MIGRATION_ZONE: test
          MIGRATION_IMAGE_TAG: ${{ needs.init.outputs.pr }}
          MIGRATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_VAULT_SECRET_PATH: ${{ steps.vault_settings.outputs.vault_secret_path }}
          MIGRATION_VAULT_ROLE: ${{ steps.vault_settings.outputs.vault_role }}
          MIGRATION_VAULT_SERVICE_ACCOUNT: ${{ steps.vault_settings.outputs.vault_service_account }}
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          commands: bash scripts/run-next-migrations.sh
          timeout: 18m
          base: ${{ github.event.before || 'HEAD^' }}
          triggers: |
            next/
            openshift/
            .github/workflows/*.yml
            renovate.json
      - uses: bcgov/actions-openshift/deployer@45d8c7f7d0d5e3b15786cb99a83f410e01547133 # v0.9.0
        with:
          file: openshift/next.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          parameters: >-
            -p ZONE="test"
            -p NAME="zeva2"
            -p MEMORY_REQUEST="400Mi"
            -p IMAGE_TAG="${{ needs.init.outputs.pr }}"
            -p VAULT_SECRET_PATH="${{ steps.vault_settings.outputs.vault_secret_path }}"
            -p VAULT_ROLE="${{ steps.vault_settings.outputs.vault_role }}"
            -p VAULT_SERVICE_ACCOUNT="${{ steps.vault_settings.outputs.vault_service_account }}"
          base: ${{ github.event.before || 'HEAD^' }}
          triggers: |
            next/
            openshift/
            .github/workflows/*.yml
            renovate.json
      - uses: bcgov/actions-openshift/deployer@45d8c7f7d0d5e3b15786cb99a83f410e01547133 # v0.9.0
        with:
          file: openshift/bullmq.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          parameters: >-
            -p ZONE="test"
            -p NAME="zeva2"
            -p MEMORY_REQUEST="200Mi"
            -p IMAGE_TAG="${{ needs.init.outputs.pr }}"
            -p VAULT_SECRET_PATH="${{ steps.vault_settings.outputs.vault_secret_path }}"
            -p VAULT_ROLE="${{ steps.vault_settings.outputs.vault_role }}"
            -p VAULT_SERVICE_ACCOUNT="${{ steps.vault_settings.outputs.vault_service_account }}"
          base: ${{ github.event.before || 'HEAD^' }}
          triggers: |
            next/
            openshift/
            .github/workflows/*.yml
            renovate.json

  results:
    name: Merge Results
    needs: [init, deploys]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
