
name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  builds:
    name: Builds (${{ matrix.package }})
    permissions:
      packages: write
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        package: [next, bullmq]
        include:
          - package: next
            context: next
            file: next/Dockerfile-Openshift
            triggers: |
              next/
              .github/workflows/pr-open.yml
          - package: bullmq
            context: next
            file: next/Dockerfile-Bullmq-Openshift
            triggers: |
              next/
              .github/workflows/pr-open.yml
    steps:
      - uses: bcgov/actions/builder@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          package: ${{ matrix.package }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          triggers: ${{ matrix.triggers }}
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}
          tag_fallback: latest

  deploy-services:
    name: Deploy ${{ matrix.service }}
    needs: [builds]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - service: database
            file: openshift/database.deploy.yml
          - service: redis
            file: openshift/redis.deploy.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy database
        if: matrix.service == 'database'
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          overwrite: "false"
          parameters: >-
            -p ZONE="pr-${{ github.event.number }}"
            -p NAME="zeva2"
            -p DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          triggers: |
            next/
            openshift/
            .github/workflows/pr-open.yml
      - name: Deploy Redis
        if: matrix.service == 'redis'
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          overwrite: "false"
          parameters: -p ZONE="pr-${{ github.event.number }}" -p NAME="zeva2"
          triggers: |
            next/
            openshift/
            .github/workflows/pr-open.yml

  deploys:
    name: Deploys (${{ matrix.name }})
    needs: [builds, deploy-services]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [next, bullmq]
        include:
          - name: next
            file: openshift/next.deploy.yml
          - name: bullmq
            file: openshift/bullmq.deploy.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive Vault settings from OpenShift namespace
        id: vault_settings
        shell: bash
        env:
          OC_NAMESPACE: ${{ vars.OC_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ ! "$OC_NAMESPACE" =~ ^[a-z0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::OC_NAMESPACE must contain a lowercase namespace plate followed by a hyphen and environment."
            exit 1
          fi
          namespaceplate="${OC_NAMESPACE%%-*}"
          echo "vault_secret_path=${namespaceplate}-nonprod/dev" >> "$GITHUB_OUTPUT"
          echo "vault_role=${namespaceplate}-nonprod" >> "$GITHUB_OUTPUT"
          echo "vault_service_account=${namespaceplate}-vault" >> "$GITHUB_OUTPUT"
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          parameters: >-
            -p ZONE="pr-${{ github.event.number }}"
            -p NAME="zeva2"
            -p COMPONENT="${{ matrix.name }}"
            -p IMAGE_TAG="${{ github.event.pull_request.head.sha }}"
            -p VAULT_SECRET_PATH="${{ steps.vault_settings.outputs.vault_secret_path }}"
            -p VAULT_ROLE="${{ steps.vault_settings.outputs.vault_role }}"
            -p VAULT_SERVICE_ACCOUNT="${{ steps.vault_settings.outputs.vault_service_account }}"
          triggers: |
            next/
            openshift/
            .github/workflows/pr-open.yml

  tests:
    name: Health Check (${{ matrix.component }})
    needs: [deploys]
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        component: [next, bullmq]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions/diff-triggers@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        id: triggers
        with:
          triggers: |
            next/
            next/bullmq
            openshift/
            .github/workflows/pr-open.yml
      - name: Wait for Next.js healthcheck
        if: matrix.component == 'next' && steps.triggers.outputs.triggered == 'true'
        run: |
          set -euo pipefail
          URL="https://zeva2-pr-${{ github.event.number }}-next.apps.silver.devops.gov.bc.ca/api/health"
          echo "Waiting for Next.js healthcheck at $URL..."
          for i in {1..30}; do
            status=$(curl -k --connect-timeout 3 --max-time 5 -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$status" -eq 200 ]; then
              echo "Next.js is healthy (HTTP 200)."
              exit 0
            fi
            echo "Waiting for healthcheck (HTTP $status), retrying in 5s... ($i/30)"
            sleep 5
          done
          echo "ERROR: Next.js did not become healthy within 5 minutes."
          exit 1
      - name: Wait for BullMQ deployment readiness
        if: matrix.component == 'bullmq' && steps.triggers.outputs.triggered == 'true'
        env:
          OC_NAMESPACE: ${{ vars.OC_NAMESPACE }}
          OC_SERVER: ${{ vars.OC_SERVER }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT="zeva2-pr-${{ github.event.number }}-bullmq"
          URL="${OC_SERVER%/}/apis/apps/v1/namespaces/${OC_NAMESPACE}/deployments/${DEPLOYMENT}"
          echo "Waiting for BullMQ deployment $DEPLOYMENT to become ready..."
          for i in {1..30}; do
            response=$(curl -k --connect-timeout 3 --max-time 5 -sS \
              -H "Authorization: Bearer ${OC_TOKEN}" \
              -H "Accept: application/json" \
              "$URL" || true)
            if jq -e '
              (.spec.replicas // 1) as $desired |
              (.status.observedGeneration // 0) >= (.metadata.generation // 1) and
              (.status.updatedReplicas // 0) >= $desired and
              (.status.availableReplicas // 0) >= $desired
            ' <<<"$response" >/dev/null 2>&1; then
              echo "BullMQ deployment is updated and available."
              exit 0
            fi
            echo "BullMQ deployment is not ready yet; retrying in 5s... ($i/30)"
            sleep 5
          done
          echo "ERROR: BullMQ deployment did not become ready within 5 minutes."
          exit 1


  comment:
    name: Deployment Links
    needs: [deploys, tests]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions/diff-triggers@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        id: triggers
        with:
          triggers: |
            next/
            openshift/
            .github/workflows/pr-open.yml
      - name: Post Deploy Links
        if: steps.triggers.outputs.triggered == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-deployment-links
          message: |
            ### 🚀 Deployments Available (PR #${{ github.event.number }})
            - [Next.js](https://zeva2-pr-${{ github.event.number }}-next.apps.silver.devops.gov.bc.ca)

  results:
    name: PR Results
    needs: [builds, deploy-services, deploys, tests, comment]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
