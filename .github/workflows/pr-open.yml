
name: PR

on:
  pull_request:
    branches:
      - ci/adopt-quickstart

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  builds:
    name: Builds (${{ matrix.package }})
    permissions:
      packages: write
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        package: [next, bullmq]
        include:
          - package: next
            context: next
            file: next/Dockerfile-Openshift
            triggers: |
              next/
              .github/workflows/pr-open.yml
          - package: bullmq
            context: next
            file: next/Dockerfile-Bullmq-Openshift
            triggers: |
              next/bullmq
              .github/workflows/pr-open.yml
    steps:
      - uses: bcgov/actions/builder@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          package: ${{ matrix.package }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          triggers: ${{ matrix.triggers }}
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}
          tag_fallback: latest

  deploy-services:
    name: Deploy ${{ matrix.service }}
    needs: [builds]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - service: database
            file: openshift/database.deploy.yml
          - service: redis
            file: openshift/redis.deploy.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          overwrite: "false"
          parameters: -p ZONE="pr-${{ github.event.number }}" -p NAME="zeva2"
          triggers: |
            next/
            openshift/
            .github/workflows/pr-open.yml
