# Deploys a specified version by updating the CD repository values file directly.

name: Deploy Template

on:
  workflow_call:
    inputs:
      # The git reference to check out the repository
      git_ref:
        required: true
        type: string
      # The version of the application to build
      # This is typically set by the GitVersion action in the calling workflow
      version:
        required: true
        type: string
      # The OpenShift Tools namespace that holds the built images to tag from.
      tools_namespace:
        required: true
        type: string
      # The name of the values file to use for the deployment
      values_file:
        required: true
        type: string
      target_namespace:
        required: true
        type: string
      # The GitHub environment (dev, test or prod) whose secrets and
      # protection rules apply to this deployment.
      environment:
        required: true
        type: string
    secrets:
      # the key used to checkout CD repository
      manifest-repo-deploy-key:
        required: true
      openshift-server:
        required: true
      openshift-token:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Zeva2
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60

    steps:
      - name: Restore oc command from Cache
        uses: actions/cache@v5.0.4
        with:
          path: /usr/local/bin/oc
          key: oc-cli-${{ runner.os }}

      - name: Log in to Openshift
        run: |
          oc login --server="${{ secrets.openshift-server }}" --token="${{ secrets.openshift-token }}"
          oc project "${{ inputs.target_namespace }}"

      - name: Tag images to target namespace
        run: |
          oc tag ${{ inputs.tools_namespace }}/zeva2-next:${{ inputs.version }} ${{ inputs.target_namespace }}/zeva2-next:${{ inputs.version }} --reference-policy=local
          oc tag ${{ inputs.tools_namespace }}/zeva2-bullmq:${{ inputs.version }} ${{ inputs.target_namespace }}/zeva2-bullmq:${{ inputs.version }} --reference-policy=local

      - name: Resolve image digests
        id: image_digests
        shell: bash
        run: |
          set -euo pipefail
          next_image_digest=$(oc -n "${{ inputs.target_namespace }}" get istag "zeva2-next:${{ inputs.version }}" -o jsonpath='{.image.metadata.name}')
          bullmq_image_digest=$(oc -n "${{ inputs.target_namespace }}" get istag "zeva2-bullmq:${{ inputs.version }}" -o jsonpath='{.image.metadata.name}')
          for digest in "$next_image_digest" "$bullmq_image_digest"; do
            [[ "$digest" == sha256:* ]] || { echo "Invalid image digest: $digest"; exit 1; }
          done
          echo "next_image_digest=$next_image_digest" >> "$GITHUB_OUTPUT"
          echo "bullmq_image_digest=$bullmq_image_digest" >> "$GITHUB_OUTPUT"

      - name: Checkout CD repository
        uses: actions/checkout@v6.0.2
        with:
          repository: bcgov-c/tenant-gitops-ea8eab
          ref: main
          ssh-key: ${{ secrets.manifest-repo-deploy-key }}

      - name: Update image references
        uses: mikefarah/yq@v4.40.5
        with:
          cmd: |
            yq -i '.image.tag = "${{ inputs.version }}"' zeva2/zeva2-next/${{ inputs.values_file }}
            yq -i '.image.digest = "${{ steps.image_digests.outputs.next_image_digest }}"' zeva2/zeva2-next/${{ inputs.values_file }}
            yq -i '.image.tag = "${{ inputs.version }}"' zeva2/zeva2-bullmq/${{ inputs.values_file }}
            yq -i '.image.digest = "${{ steps.image_digests.outputs.bullmq_image_digest }}"' zeva2/zeva2-bullmq/${{ inputs.values_file }}

      # push the changes to the CD repo
      - name: GitHub Commit & Push
        shell: bash {0}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add zeva2/zeva2-next/${{ inputs.values_file}}
          git add zeva2/zeva2-bullmq/${{ inputs.values_file}}
          git commit -m "Update the zeva2 image tags to ${{ inputs.version}} on ${{ inputs.target_namespace }}"
          git push

      - name: Verify ArgoCD rollout after GitOps update
        shell: bash
        env:
          NEXT_IMAGE_DIGEST: ${{ steps.image_digests.outputs.next_image_digest }}
          BULLMQ_IMAGE_DIGEST: ${{ steps.image_digests.outputs.bullmq_image_digest }}
          NAMESPACE: ${{ inputs.target_namespace }}
        run: |
          set -euo pipefail
          # Already authenticated in the "Log in to Openshift" step; kubeconfig persists across steps.

          case "${{ inputs.values_file }}" in
            values-dev.yaml) env_name="dev" ;;
            values-test.yaml) env_name="test" ;;
            values-prod.yaml) env_name="prod" ;;
            *) echo "Unsupported values file: ${{ inputs.values_file }}"; exit 1 ;;
          esac

          # ArgoCD needs a short moment to notice the new commit before it starts syncing.
          # Until the Deployment's image digest matches the promoted artifact, the sync has
          # not been applied yet, so poll the Deployment spec before checking the rollout.
          wait_for_image_digest() {
            local deployment="$1"
            local expected_digest="$2"
            local timeout=600
            local elapsed=0
            local interval=10
            while true; do
              local image
              image=$(oc get "deployment/${deployment}" -n "${NAMESPACE}" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
              if [[ "${image}" == *"@${expected_digest}" ]]; then
                echo "${deployment}: Deployment now targets digest ${expected_digest} (ArgoCD sync applied)."
                return 0
              fi
              if [ "${elapsed}" -ge "${timeout}" ]; then
                echo "${deployment}: timed out waiting for digest ${expected_digest}; current image is '${image:-<none>}'"
                return 1
              fi
              echo "${deployment}: current image '${image:-<none>}' does not use digest '${expected_digest}'; waiting for ArgoCD to sync..."
              sleep "${interval}"
              elapsed=$((elapsed + interval))
            done
          }

          for app in "zeva2-next-${env_name}" "zeva2-bullmq-${env_name}"; do
            echo "Verifying ${app}..."
            case "${app}" in
              zeva2-next-*) expected_digest="${NEXT_IMAGE_DIGEST}" ;;
              zeva2-bullmq-*) expected_digest="${BULLMQ_IMAGE_DIGEST}" ;;
            esac
            wait_for_image_digest "${app}" "${expected_digest}"
            oc rollout status "deployment/${app}" -n "${NAMESPACE}" --timeout=600s

            # The ArgoCD Application status check is best-effort: the CI service account
            # may not be allowed to read Application resources (they often live in a
            # cluster-scoped ArgoCD namespace). The rollout status above already proves
            # the new version is live, so we only report ArgoCD status when accessible
            # and never fail the job on a permission or lookup error.
            app_ns=$(oc get applications.argoproj.io -n "${NAMESPACE}" --no-headers \
              -o custom-columns=NAME:.metadata.name 2>/dev/null | grep -Fx "${app}" >/dev/null 2>&1 \
              && echo "${NAMESPACE}" || true)
            if [ -n "${app_ns}" ]; then
              oc wait --for=jsonpath='{.status.sync.status}'=Synced "applications.argoproj.io/${app}" -n "${app_ns}" --timeout=600s || true
              oc wait --for=jsonpath='{.status.health.status}'=Healthy "applications.argoproj.io/${app}" -n "${app_ns}" --timeout=600s || true
              echo "${app} ArgoCD status reported (synced/healthy)."
            else
              echo "${app}: ArgoCD Application not accessible in ${NAMESPACE}; skipping ArgoCD status check."
            fi
            echo "${app} is rolled out to ${expected_digest}."
          done
