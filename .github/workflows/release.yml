name: Release

# Publishing a GitHub release deploys that release to PROD. It reuses the
# images merge.yml deployed for the release's commit (tagged with the merged
# PR number by pr-open.yml) and does not rebuild anything.

on:
  release:
    types: [published]

# Same group as merge.yml (its workflow name), so the two never deploy PROD at once
concurrency:
  group: Merge
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # PR number for the release's commit (a squash merge to main)
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1

      - name: Check images
        env:
          PR: ${{ steps.pr.outputs.pr }}
          REPO: ${{ github.repository }}
          RELEASE: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "${PR}" ]; then
            echo "::error::No merged PR found for ${RELEASE} (${GITHUB_SHA}). Release from a commit on main that came from a PR."
            exit 1
          fi
          for package in next bullmq; do
            image="ghcr.io/${REPO}/${package}:${PR}"
            if ! digest=$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}'); then
              echo "::error::Image ${image} not found. Packages must be public, and the release's commit must come from a PR that built images."
              exit 1
            fi
            echo "${RELEASE}: ${image} (${digest})" | tee -a "${GITHUB_STEP_SUMMARY}"
          done

  deploys:
    name: Production Deploys
    needs: [init]
    environment: prod
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive Vault settings from OpenShift namespace
        id: vault_settings
        shell: bash
        env:
          OC_NAMESPACE: ${{ vars.OC_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ ! "$OC_NAMESPACE" =~ ^[a-z0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::OC_NAMESPACE must contain a lowercase namespace plate followed by a hyphen and environment."
            exit 1
          fi
          namespaceplate="${OC_NAMESPACE%%-*}"
          {
            echo "vault_secret_path=${namespaceplate}-prod"
            echo "vault_role=${namespaceplate}-prod"
            echo "vault_service_account=${namespaceplate}-vault"
          } >> "$GITHUB_OUTPUT"
      - uses: bcgov/actions-openshift/oc-runner@510a8105fdffbb718094e8a093e638132e300975 # v0.10.0
        env:
          MIGRATION_ZONE: prod
          MIGRATION_IMAGE_TAG: ${{ needs.init.outputs.pr }}
          MIGRATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_VAULT_SECRET_PATH: ${{ steps.vault_settings.outputs.vault_secret_path }}
          MIGRATION_VAULT_ROLE: ${{ steps.vault_settings.outputs.vault_role }}
          MIGRATION_VAULT_SERVICE_ACCOUNT: ${{ steps.vault_settings.outputs.vault_service_account }}
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          commands: bash scripts/run-next-migrations.sh
          timeout: 18m
      - uses: bcgov/actions-openshift/deployer@510a8105fdffbb718094e8a093e638132e300975 # v0.10.0
        with:
          file: openshift/next.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          parameters: >-
            -p ZONE="prod"
            -p NAME="zeva2"
            -p MEMORY_REQUEST="400Mi"
            -p IMAGE_TAG="${{ needs.init.outputs.pr }}"
            -p VAULT_SECRET_PATH="${{ steps.vault_settings.outputs.vault_secret_path }}"
            -p VAULT_ROLE="${{ steps.vault_settings.outputs.vault_role }}"
            -p VAULT_SERVICE_ACCOUNT="${{ steps.vault_settings.outputs.vault_service_account }}"
      - uses: bcgov/actions-openshift/deployer@510a8105fdffbb718094e8a093e638132e300975 # v0.10.0
        with:
          file: openshift/bullmq.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          parameters: >-
            -p ZONE="prod"
            -p NAME="zeva2"
            -p MEMORY_REQUEST="200Mi"
            -p IMAGE_TAG="${{ needs.init.outputs.pr }}"
            -p VAULT_SECRET_PATH="${{ steps.vault_settings.outputs.vault_secret_path }}"
            -p VAULT_ROLE="${{ steps.vault_settings.outputs.vault_role }}"
            -p VAULT_SERVICE_ACCOUNT="${{ steps.vault_settings.outputs.vault_service_account }}"

  promote:
    name: Promote Images
    needs: [init, deploys]
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      matrix:
        package: [next, bullmq]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5.0.0
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.init.outputs.pr }}
          tags: prod

  results:
    name: Release Results
    needs: [init, deploys, promote]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: bcgov/actions/workflow-results@6c8ac0469fcf0d826533bc526c90119b8f149884 # v0.13.0
        with:
          needs: ${{ toJson(needs) }}
          title: Release Results

      - name: Notify on Failure
        if: failure()
        uses: bcgov/actions/workflow-notifier@6c8ac0469fcf0d826533bc526c90119b8f149884 # v0.13.0
