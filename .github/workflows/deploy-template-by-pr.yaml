# Updates CD repository values and creates a pull request for review instead of pushing directly to main.

name: Deploy Template By Pull Request

on:
  workflow_call:
    inputs:
      # The git reference to check out the repository
      git_ref:
        required: true
        type: string
      # The version of the application to build
      # This is typically set by the GitVersion action in the calling workflow
      version:
        required: true
        type: string
      next_image_digest:
        required: true
        type: string
      bullmq_image_digest:
        required: true
        type: string
      # The name of the values file to use for the deployment
      values_file:
        required: true
        type: string
      target_namespace:
        required: true
        type: string
    secrets:
      # the key used to checkout CD repository
      manifest-repo-deploy-key:
        required: true
      # the token used to create a pull request in the CD repository
      manifest-repo-token:
        required: true
      openshift-server:
        required: true
      openshift-token:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy Zeva2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Restore oc command from Cache
        uses: actions/cache@v5.0.4
        with:
          path: /usr/local/bin/oc
          key: oc-cli-${{ runner.os }}

      - name: Checkout CD repository
        uses: actions/checkout@v6.0.2
        with:
          repository: bcgov-c/tenant-gitops-ea8eab
          ref: main
          ssh-key: ${{ secrets.manifest-repo-deploy-key }}

      - name: Check if the tag has been released
        id: check_version
        shell: bash
        run: |
          set -euo pipefail
          current_version=$(yq -r '.image.tag' "zeva2/zeva2-next/${{ inputs.values_file }}")
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          if [ "$current_version" = "${{ inputs.version }}" ]; then
            echo "The version ${{ inputs.version }} has been deployed"
            exit 1
          fi

      - name: Check for backward deployment
        id: backward_check
        shell: bash
        run: |
          set -euo pipefail
          current_version="${{ steps.check_version.outputs.current_version }}"
          input_version="${{ inputs.version }}"
          if [ "$input_version" != "$current_version" ] && [ "$(printf '%s\n' "$input_version" "$current_version" | sort -V | head -n1)" = "$input_version" ]; then
            echo "is_backward=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_backward=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set pull request info
        id: pr_info
        shell: bash
        run: |
          case "${{ inputs.values_file }}" in
            values-dev.yaml)
              branch="dev-release-${{ inputs.version }}-${{ github.run_id }}"
              env_name="Dev"
              ;;
            values-test.yaml)
              branch="test-release-${{ inputs.version }}-${{ github.run_id }}"
              env_name="Test"
              ;;
            values-prod.yaml)
              branch="prod-release-${{ inputs.version }}-${{ github.run_id }}"
              env_name="Prod"
              ;;
            *)
              echo "Unsupported values_file: ${{ inputs.values_file }}"
              exit 1
              ;;
          esac
          title="${env_name} Release - Update zeva2 image tags to ${{ inputs.version }}"
          echo "env_name=$env_name" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "Environment: ${env_name}"
            echo ""
            echo "- Current version: ${{ steps.check_version.outputs.current_version }}"
            echo "- Target version: **${{ inputs.version }}**"
            if [ "${{ steps.backward_check.outputs.is_backward }}" = "true" ]; then
              echo ""
              echo "**A backward deployment has been detected.**"
              echo "Please reject this pull request and contact DevOps or Developers if you have any questions."
              echo "If this backward deployment is what is expected, the pull request can be merged."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update image references
        uses: mikefarah/yq@v4.40.5
        with:
          cmd: |
            yq -i '.image.tag = "${{ inputs.version}}"' zeva2/zeva2-next/${{ inputs.values_file }}
            # yq -i '.image.digest = "${{ inputs.next_image_digest }}"' zeva2/zeva2-next/${{ inputs.values_file }}
            yq -i '.image.tag = "${{ inputs.version}}"' zeva2/zeva2-bullmq/${{ inputs.values_file }}
            # yq -i '.image.digest = "${{ inputs.bullmq_image_digest }}"' zeva2/zeva2-bullmq/${{ inputs.values_file }}

      - name: Create pull request to main
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.manifest-repo-token }}
          commit-message: "${{ steps.pr_info.outputs.title }}"
          title: "${{ steps.pr_info.outputs.title }}"
          body: "${{ steps.pr_info.outputs.body }}"
          branch: "${{ steps.pr_info.outputs.branch }}"
          base: main
          add-paths: |
            zeva2/zeva2-next/${{ inputs.values_file}}
            zeva2/zeva2-bullmq/${{ inputs.values_file}}

      - name: Verify ArgoCD rollout after CD repo update is merged
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.version }}
          NAMESPACE: ${{ inputs.target_namespace }}
        run: |
          set -euo pipefail
          echo "The CD repo PR has been created. Waiting for it to be merged so ArgoCD can reconcile the change."
          oc login --server="${{ secrets.openshift-server }}" --token="${{ secrets.openshift-token }}"
          oc project "${NAMESPACE}"

          case "${{ inputs.values_file }}" in
            values-dev.yaml) env_name="dev" ;;
            values-test.yaml) env_name="test" ;;
            values-prod.yaml) env_name="prod" ;;
            *) echo "Unsupported values file: ${{ inputs.values_file }}"; exit 1 ;;
          esac

          # The change only goes live once the review PR is merged and ArgoCD syncs it.
          # Until the Deployment's image tag matches the released version, the sync has not
          # been applied yet, so we poll the Deployment spec before checking the rollout.
          # The timeout covers both the PR review/merge wait and the ArgoCD sync.
          wait_for_image_tag() {
            local deployment="$1"
            local timeout=3000
            local elapsed=0
            local interval=15
            while true; do
              local image running_tag
              image=$(oc get "deployment/${deployment}" -n "${NAMESPACE}" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
              running_tag="${image##*:}"
              if [ "${running_tag}" = "${EXPECTED_TAG}" ]; then
                echo "${deployment}: Deployment now targets tag ${EXPECTED_TAG} (PR merged and ArgoCD sync applied)."
                return 0
              fi
              if [ "${elapsed}" -ge "${timeout}" ]; then
                echo "${deployment}: timed out waiting for tag ${EXPECTED_TAG}; current image is '${image:-<none>}'"
                echo "The PR may not have been merged yet. Merge it and re-run this workflow to verify."
                return 1
              fi
              echo "${deployment}: current tag '${running_tag:-<none>}' != expected '${EXPECTED_TAG}'; waiting for PR merge / ArgoCD sync..."
              sleep "${interval}"
              elapsed=$((elapsed + interval))
            done
          }

          for app in "zeva2-next-${env_name}" "zeva2-bullmq-${env_name}"; do
            echo "Verifying ${app}..."
            wait_for_image_tag "${app}"
            oc rollout status "deployment/${app}" -n "${NAMESPACE}" --timeout=600s

            app_ns=$(oc get applications.argoproj.io -A --no-headers -o custom-columns=NAME:.metadata.name,NAMESPACE:.metadata.namespace | awk -v app="$app" '$1 == app {print $2; exit}')
            if [ -n "${app_ns}" ]; then
              oc wait --for=jsonpath='{.status.sync.status}'=Synced "applications.argoproj.io/${app}" -n "${app_ns}" --timeout=600s
              oc wait --for=jsonpath='{.status.health.status}'=Healthy "applications.argoproj.io/${app}" -n "${app_ns}" --timeout=600s
            fi
            echo "${app} is synced, healthy, and rolled out to ${EXPECTED_TAG}."
          done
