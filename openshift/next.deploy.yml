apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: zeva2-next
parameters:
  - name: NAME
    description: Application module name
    value: zeva2
    required: true
  - name: ZONE
    description: Deployment zone, e.g. pr-123, dev, test, or prod
    value: dev
    required: true
  - name: IMAGE_TAG
    description: GHCR image tag or digest
    required: true
  - name: REGISTRY
    description: Container registry
    value: ghcr.io
  - name: ORG_NAME
    description: Organization or owner name
    value: bcgov
  - name: DOMAIN
    description: OpenShift application cluster domain
    value: apps.silver.devops.gov.bc.ca
  - name: VAULT_SECRET_PATH
    description: Base Vault secret path for the selected environment
    value: namespaceplate-nonprod/dev
  - name: VAULT_ROLE
    description: Vault Kubernetes auth role
    value: namespaceplate-nonprod
  - name: VAULT_SERVICE_ACCOUNT
    description: Existing service account used for Vault authentication
    required: true
  - name: CPU_REQUEST
    value: 20m
  - name: MEMORY_REQUEST
    value: 400Mi

objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-${ZONE}-next
      labels:
        app: ${NAME}-${ZONE}
        deployment: ${NAME}-${ZONE}-next
    spec:
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-next
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-inject-secret-auth: "${VAULT_SECRET_PATH}/zeva2-auth"
            vault.hashicorp.com/agent-inject-secret-cthub: "${VAULT_SECRET_PATH}/zeva2-cthub"
            vault.hashicorp.com/agent-inject-secret-database: "${VAULT_SECRET_PATH}/zeva2-database"
            vault.hashicorp.com/agent-inject-secret-s3: "${VAULT_SECRET_PATH}/zeva2-s3"
            vault.hashicorp.com/agent-inject-secret-redis: "${VAULT_SECRET_PATH}/zeva2-redis-connection"
            vault.hashicorp.com/agent-inject-template-auth: |
              {{- with secret "${VAULT_SECRET_PATH}/zeva2-auth" -}}
                export AUTH_SECRET="{{ .Data.data.auth_secret }}"
                export AUTH_KEYCLOAK_ID="{{ .Data.data.auth_keycloak_id }}"
                export AUTH_KEYCLOAK_ISSUER="{{ .Data.data.auth_keycloak_issuer }}"
                export AUTH_TRUST_HOST="{{ .Data.data.auth_trust_host }}"
                export AUTH_URL="{{ .Data.data.auth_url }}"
              {{- end }}
            vault.hashicorp.com/agent-inject-template-cthub: |
              {{- with secret "${VAULT_SECRET_PATH}/zeva2-cthub" -}}
                export CTHUB_URL="{{ .Data.data.cthub_url }}"
                export CTHUB_TOKEN="{{ .Data.data.cthub_token }}"
              {{- end }}
            vault.hashicorp.com/agent-inject-template-database: |
              {{- with secret "${VAULT_SECRET_PATH}/zeva2-database" -}}
                export DATABASE_URL="{{ .Data.data.database_url }}"
                export DATABASE_URL_FOR_MIGRATIONS="{{ .Data.data.database_url_for_migrations }}" 
                export DATABASE_URL_OLD="{{ .Data.data.database_url_old }}"
              {{- end }}
            vault.hashicorp.com/agent-inject-template-s3: |
              {{- with secret "${VAULT_SECRET_PATH}/zeva2-s3" -}}
                export S3_ACCESS_KEY="{{ .Data.data.access_key }}"
                export S3_BUCKET_NAME="{{ .Data.data.bucket_name }}"
                export S3_ENDPOINT="{{ .Data.data.endpoint }}"
                export S3_SECRET_KEY="{{ .Data.data.secret_key }}"
                export S3_PREFIX="{{ .Data.data.prefix }}"
                export S3_REGION="{{ .Data.data.region }}"
              {{- end }}
            vault.hashicorp.com/agent-inject-template-redis: |
              {{- with secret "${VAULT_SECRET_PATH}/zeva2-redis-connection" -}}
                export REDIS_PASSWORD="{{ .Data.data.redis_password }}"
              {{- end }}                
            vault.hashicorp.com/agent-inject-token: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/auth-path: auth/k8s-silver
            vault.hashicorp.com/namespace: platform-services
            vault.hashicorp.com/role: ${VAULT_ROLE}
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-next
        spec:
          serviceAccountName: ${VAULT_SERVICE_ACCOUNT}
          containers:
            - name: next
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/next:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
                  protocol: TCP
              startupProbe:
                httpGet:
                  path: /api/health
                  port: http
                  scheme: HTTP
                failureThreshold: 30
                periodSeconds: 10
                timeoutSeconds: 3
              livenessProbe:
                failureThreshold: 10
                httpGet:
                  path: /api/health
                  port: 3000
                  scheme: HTTP
                initialDelaySeconds: 40
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 3
              readinessProbe:
                failureThreshold: 10
                initialDelaySeconds: 30
                periodSeconds: 10
                successThreshold: 1
                tcpSocket:
                  port: 3000
                timeoutSeconds: 3
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
              volumeMounts:
                - name: next-cache
                  mountPath: /next/.next/cache
              env:
                - name: CHECKPOINT_DISABLE
                  value: "1"
                - name: START_WORKERS
                  value: "false"
                - name: TZ
                  value: America/Vancouver
                - name: REDIS_TLS_ENABLED
                  value: "true"
                - name: REDIS_HOST
                  value: "zeva2-dandyredis-${ZONE}-redis-ha-haproxy"
                - name: REDIS_PORT
                  value: "6379"
                - name: BEGINNING_OF_COMPLIANCE_YEAR
                  value: "10-01T00:00:00.000"
                - name: END_OF_COMPLIANCE_YEAR
                  value: "09-30T23:59:59.999"
          volumes:
            - name: next-cache
              emptyDir: {}

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-${ZONE}-next
      labels:
        app: ${NAME}-${ZONE}
        deployment: ${NAME}-${ZONE}-next
    spec:
      type: ClusterIP
      ports:
        - port: 3000
          targetPort: http
          protocol: TCP
          name: http
      selector:
        deployment: ${NAME}-${ZONE}-next

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${NAME}-${ZONE}-next
      labels:
        app: ${NAME}-${ZONE}
        deployment: ${NAME}-${ZONE}-next
    spec:
      host: ${NAME}-${ZONE}-next.${DOMAIN}
      to:
        kind: Service
        name: ${NAME}-${ZONE}-next
        weight: 100
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      wildcardPolicy: None